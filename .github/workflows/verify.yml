name: verify

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    name: Build and verify (npm run verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: .github/scripts/annotate.sh 'npm run verify' npm run verify

  as-action:
    # Runs the built action the way GitHub runs any JavaScript action: the runner
    # launches dist/index.js of a deployed copy on its own bundled Node 24, with no
    # node flags.
    name: Run as a GitHub action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: .github/scripts/annotate.sh 'npm run build' npm run build

      - name: Deploy the action like a release checkout (action.yml, dist/, and any shipped node_modules)
        run: .github/scripts/annotate.sh 'deploy' node app/scripts/deploy.mjs deployed-action

      - name: Remove the repo's node_modules so the action can only use what was deployed
        run: rm -rf node_modules app/node_modules sdk/node_modules

      - name: Start the fake collector and target
        run: |
          node app/scripts/serve-fake-backend.mjs 4318 "$RUNNER_TEMP/backend.json" > "$RUNNER_TEMP/backend.log" 2>&1 &
          timeout 10 bash -c 'until (echo > /dev/tcp/127.0.0.1/4318) 2>/dev/null; do sleep 0.1; done' \
            || { echo "fake backend did not start"; cat "$RUNNER_TEMP/backend.log"; exit 1; }

      - name: Run the toy action
        uses: ./deployed-action
        with:
          target-url: http://127.0.0.1:4318
          api-token: ci-s3cret-token
          otel-service-name: toy-action-ci
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
          OTEL_ROLLUP_DEBUG: '1'
          # The otel-service-name input takes precedence over this.
          OTEL_SERVICE_NAME: not-this-one

      - name: If the action failed, rerun the build with plain node to capture its output
        if: failure()
        run: >-
          .github/scripts/annotate.sh 'action output (plain node rerun)'
          env 'INPUT_TARGET-URL=http://127.0.0.1:4318'
          OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318
          OTEL_ROLLUP_DEBUG=1
          node deployed-action/dist/index.js

      - name: Check what the collector received
        run: .github/scripts/annotate.sh 'check-backend' node app/scripts/check-backend.mjs "$RUNNER_TEMP/backend.json" toy-action-ci ci-s3cret-token

      - name: Upload the build and backend state
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: as-action-debug
          path: |
            deployed-action/dist
            ${{ runner.temp }}/backend.json
            ${{ runner.temp }}/backend.log
