name: verify

on:
  push:
  workflow_dispatch:

jobs:
  size:
    # Temporary: compare bundle sizes between main and the prebundled-SDK branch.
    name: Compare bundle sizes with main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: git fetch --depth=1 origin main && git worktree add "$RUNNER_TEMP/main" FETCH_HEAD
      - run: npm install --no-audit --no-fund
        working-directory: ${{ runner.temp }}/main
      - run: >-
          .github/scripts/annotate.sh 'size: main vs branch' .github/scripts/size-compare.sh
