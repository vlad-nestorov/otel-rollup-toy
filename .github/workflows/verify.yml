name: verify

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    name: Build and verify (npm run verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: .github/scripts/annotate.sh 'npm run verify' npm run verify

  as-action:
    # Runs the built action the way GitHub runs any JavaScript action: the runner
    # launches app/dist/index.js on its own bundled Node 24, with no node flags.
    name: Run as a GitHub action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: .github/scripts/annotate.sh 'npm run build' npm run build

      - name: Diagnostics (temporary)
        if: always()
        run: |
          .github/scripts/annotate.sh 'diag: forwarded-parse in OTel dist' bash -c 'grep -rn -B2 -A2 "forwarded-parse" node_modules/@opentelemetry/instrumentation-http/dist/ --include=*.mjs | cut -c1-220 | head -40'
          .github/scripts/annotate.sh 'diag: require shims in OTel dist' bash -c 'grep -rnoE "(createRequire|__require|require\()[^;]{0,80}" node_modules/@opentelemetry/*/dist/*.mjs node_modules/@opentelemetry/*/dist/platform/node/*.mjs 2>/dev/null | cut -c1-200 | sort | uniq | head -60'
          .github/scripts/annotate.sh 'diag: bundle requires' bash -c 'grep -rnoE ".{0,80}(forwarded-parse|require-in-the-middle|supports-color).{0,40}" app/dist/*.js | cut -c1-220 | head -30'

      - name: Remove node_modules so the action can only use what's in dist/
        run: rm -rf node_modules app/node_modules plugin/node_modules

      - name: Start the fake collector and target
        run: |
          node app/scripts/serve-fake-backend.mjs 4318 "$RUNNER_TEMP/backend.json" > "$RUNNER_TEMP/backend.log" 2>&1 &
          timeout 10 bash -c 'until (echo > /dev/tcp/127.0.0.1/4318) 2>/dev/null; do sleep 0.1; done' \
            || { echo "fake backend did not start"; cat "$RUNNER_TEMP/backend.log"; exit 1; }

      - name: Run the toy action
        uses: ./app
        with:
          target-url: http://127.0.0.1:4318
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
          OTEL_ROLLUP_DEBUG: '1'

      - name: If the action failed, rerun the build with plain node to capture its output
        if: failure()
        run: >-
          .github/scripts/annotate.sh 'action output (plain node rerun)'
          env 'INPUT_TARGET-URL=http://127.0.0.1:4318'
          OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318
          OTEL_ROLLUP_DEBUG=1
          node app/dist/index.js

      - name: Check what the collector received
        run: .github/scripts/annotate.sh 'check-backend' node app/scripts/check-backend.mjs "$RUNNER_TEMP/backend.json"

      - name: Upload the build and backend state
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: as-action-debug
          path: |
            app/dist
            ${{ runner.temp }}/backend.json
            ${{ runner.temp }}/backend.log
